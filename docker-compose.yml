version: '3.8'

services:
  vem-pro-culto-api:
    build: .
    container_name: vpc-api
    mem_limit: 640m
    ports:
      - '8084:8084'
    environment:
      - JAVA_TOOL_OPTIONS=-Xms256m -Xmx512m -XX:+UseSerialGC -XX:+ShrinkHeapInSteps
      - SPRING_DATASOURCE_URL=jdbc:postgresql://host.docker.internal:5432/vpc_db
      - SPRING_DATASOURCE_USERNAME=postgres
      - SPRING_DATASOURCE_PASSWORD=123456
    extra_hosts:
      - 'host.docker.internal:host-gateway'
    restart: always
